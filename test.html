<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>世界一甘いお店</title>
  <link rel="stylesheet" href="test.css">
</head>
<body>

<header>
  <h2>世界一甘いお店</h2>
</header>

<nav>
  <ul>
    <li><a href="#">トップ</a></li>
    <li><a href="#">新着情報</a></li>
    <li><a href="#">おすすめのスイーツ</a></li>
    <li><a href="#">お問い合わせ</a></li>
  </ul>
</nav>

<main>

  <div class="sidebar">
    <ul>
      <li><a href="#">トップ</a></li>
      <li><a href="#">新着情報</a></li>
      <li><a href="#">おすすめのスイーツ</a></li>
      <li><a href="#">お問い合わせ</a></li>
    </ul>
  </div>

  <div class="content">
    <h3>お問い合わせ</h3>

    <form action="#" method="post">
      <table>

        <tr>
          <th>お名前</th>
          <td><input type="text" size="40"></td>
        </tr>

        <tr>
          <th>電話番号</th>
          <td><input type="text" size="40"></td>
        </tr>

        <tr>
          <th>メールアドレス</th>
          <td><input type="text" size="40"></td>
        </tr>

        <tr>
          <th>お近くのお店</th>
          <td>
            <select>
              <option>北海道・東北</option>
              <option>関東</option>
              <option>中部</option>
              <option>近畿</option>
              <option>中国・四国</option>
              <option>九州・沖縄</option>
            </select>
          </td>
        </tr>

        <tr>
          <th>お問い合わせ種別</th>
          <td>
            <input type="radio" name="kind"> 商品について
            <input type="radio" name="kind"> 店舗について
            <input type="radio" name="kind"> その他
          </td>
        </tr>

        <tr>
          <th>お問い合わせ内容</th>
          <td>
            <textarea cols="30" rows="5" placeholder="詳細を入力してください"></textarea>
          </td>
        </tr>

        <tr>
          <th></th>
          <td>
            <input type="submit" value="送信">
          </td>
        </tr>

      </table>
    </form>

  </div>

</main>

<footer>
</footer>

</body>
</html>
